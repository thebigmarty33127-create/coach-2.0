<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Sport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1222;
  --surface: rgba(255,255,255,0.06);
  --surface-hover: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.1);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #22c55e;
  --accent-glow: rgba(34,197,94,0.35);
  --prep: #3b82f6;
  --series: #ef4444;
  --rest: #06b6d4;
  --radius: 16px;
  --radius-lg: 24px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% -20%, rgba(59,130,246,0.18), transparent),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(34,197,94,0.1), transparent),
    radial-gradient(ellipse 50% 40% at 0% 80%, rgba(239,68,68,0.08), transparent);
  pointer-events: none;
  z-index: 0;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px;
  z-index: 10;
  flex-wrap: wrap;
}

.stat-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.stat-pill span {
  color: var(--muted);
  font-weight: 400;
}

.stat-pill strong {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.container {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 80px 24px 40px;
}

.card {
  width: 100%;
  max-width: 400px;
  padding: 36px 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  animation: fadeUp 0.5s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-title {
  margin: 0 0 6px;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.card-subtitle {
  margin: 0 0 28px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.5;
}

.field {
  margin-bottom: 16px;
  text-align: left;
}

.field label {
  display: block;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}

.field input {
  width: 100%;
  padding: 14px 16px;
  background: rgba(0,0,0,0.25);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.field input::placeholder { color: #64748b; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 28px;
  margin: 6px;
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  width: 100%;
  margin-top: 8px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  box-shadow: 0 4px 20px var(--accent-glow);
}

.btn-primary:hover {
  box-shadow: 0 6px 28px var(--accent-glow);
}

.btn-start {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  padding: 16px 48px;
  font-size: 17px;
  box-shadow: 0 4px 24px var(--accent-glow);
  margin-bottom: 24px;
}

.btn-start:hover { box-shadow: 0 6px 32px var(--accent-glow); }

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}

.btn-secondary:hover { background: var(--surface-hover); }

.btn-danger {
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--border);
  font-size: 13px;
  padding: 10px 20px;
}

.btn-danger:hover {
  color: #fca5a5;
  border-color: rgba(239,68,68,0.4);
}

.workout-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: fadeUp 0.5s ease;
}

.timer-wrap {
  position: relative;
  margin: 8px 0 20px;
}

.timer-ring {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow:
    0 0 0 4px rgba(255,255,255,0.04),
    0 20px 60px rgba(0,0,0,0.4);
  transition: box-shadow 0.4s;
}

.timer-ring.phase-prep  { box-shadow: 0 0 0 4px rgba(59,130,246,0.15), 0 0 40px rgba(59,130,246,0.2), 0 20px 60px rgba(0,0,0,0.4); }
.timer-ring.phase-series { box-shadow: 0 0 0 4px rgba(239,68,68,0.15), 0 0 40px rgba(239,68,68,0.25), 0 20px 60px rgba(0,0,0,0.4); }
.timer-ring.phase-rest  { box-shadow: 0 0 0 4px rgba(6,182,212,0.15), 0 0 40px rgba(6,182,212,0.2), 0 20px 60px rgba(0,0,0,0.4); }

.timer-inner {
  width: 210px;
  height: 210px;
  border-radius: 50%;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
}

.timer-value {
  font-size: 64px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
}

.phase-badge {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.phase-badge.prep   { background: rgba(59,130,246,0.2); color: #93c5fd; }
.phase-badge.series { background: rgba(239,68,68,0.2);  color: #fca5a5; }
.phase-badge.rest   { background: rgba(6,182,212,0.2);  color: #67e8f9; }

#nextInfo {
  margin: 4px 0 20px;
  font-size: 15px;
  color: var(--muted);
  min-height: 22px;
}

.controls {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
}

.finish-screen {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 24px;
  animation: fadeUp 0.6s ease;
}

.finish-card {
  text-align: center;
  max-width: 420px;
  padding: 48px 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(16px);
}

.finish-icon {
  font-size: 56px;
  margin-bottom: 16px;
  display: block;
}

.finish-card h1 {
  margin: 0 0 10px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.finish-card p {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="stat-pill"><span>Temps</span> <strong id="timeLeft">--:--</strong></div>
  <div class="stat-pill"><span>Reps</span> <strong id="repsLeft">--</strong></div>
</div>

<div class="container">

<div id="setup" class="card">
  <h1 class="card-title">Coach Sport</h1>
  <p class="card-subtitle">Définissez votre objectif et la durée de la séance.</p>
  <div class="field">
    <label for="total">Nombre total de répétitions</label>
    <input id="total" type="number" placeholder="Ex. 100" min="1">
  </div>
  <div class="field">
    <label for="time">Durée (minutes)</label>
    <input id="time" type="number" placeholder="Ex. 30" min="1">
  </div>
  <button class="btn btn-primary" onclick="generate()">Créer la séance</button>
</div>

<div id="workout" class="workout-area" style="display:none;">
  <button class="btn btn-start" onclick="startWorkout()">Démarrer</button>
  <div class="timer-wrap">
    <div id="circle" class="timer-ring">
      <div class="timer-inner">
        <div id="label" class="phase-badge"></div>
        <div id="timerValue" class="timer-value">--</div>
      </div>
    </div>
  </div>
  <div id="nextInfo"></div>
  <div class="controls">
    <button id="pauseBtn" class="btn btn-secondary" onclick="togglePause()" style="display:none;">Pause</button>
    <button class="btn btn-danger" onclick="skip()">Terminer</button>
  </div>
</div>

</div>

<script>
let series=[];
let current=0;
let done=0;
let totalTime=0;
let globalTimer;
let rafId;

let paused=false;
let remainingPhaseMs=0;
let phaseDuration=0;
let phaseStart=0;
let currentCallback;
let currentColor;
let currentLabel;
let currentReps=0;
let isSeriesPhase=false;

const PHASE_COLORS = {
  red:  { fill: '#ef4444', track: '#1e293b', cls: 'phase-series' },
  blue: { fill: '#3b82f6', track: '#1e293b', cls: 'phase-prep'  },
  rest: { fill: '#06b6d4', track: '#1e293b', cls: 'phase-rest'  }
};

function generate(){
  let total=parseInt(document.getElementById('total').value);
  let minutes=parseInt(document.getElementById('time').value);

  if(!total || !minutes) return;

  totalTime=minutes*60;

  series=[];
  let remaining=total;
  while(remaining>0){
    let r=Math.min(remaining, Math.floor(Math.random()*15)+1);
    series.push(r);
    remaining-=r;
  }

  current=0;
  done=0;

  document.getElementById('setup').style.display='none';
  document.getElementById('workout').style.display='flex';

  updateTop();
}

function formatTime(sec){
  let m=Math.floor(sec/60);
  let s=sec%60;
  return m+":"+(s<10?"0":"")+s;
}

function startWorkout(){
  document.querySelector('.btn-start').style.display='none';
  document.getElementById('pauseBtn').style.display='inline-flex';

  let firstReps = series[0] || 0;
  document.getElementById('nextInfo').innerText = "Première série : " + firstReps + " reps";

  runPhase(3,'Prépa','blue',()=>{
    startGlobalTimer();
    nextSeries();
  }, false, 0);
}

function startGlobalTimer(){
  globalTimer=setInterval(()=>{
    if(!paused){
      totalTime--;
      updateTop();
      if(totalTime<=0){ finish(); }
    }
  },1000);
}

function updateTop(){
  document.getElementById('timeLeft').innerText=formatTime(Math.max(0,totalTime));
  let remaining=series.slice(current).reduce((a,b)=>a+b,0);
  document.getElementById('repsLeft').innerText=remaining;
}

function nextSeries(){
  if(current>=series.length){ finish(); return; }

  document.getElementById('nextInfo').innerText="";

  let reps=series[current];
  runPhase(reps,'Série','red',()=>{
    done+=reps;
    rest(reps);
  }, true, reps);
}

function rest(lastReps){
  let restTime= lastReps<8 ? 15 : 30;

  let nextReps=series[current+1]||0;
  document.getElementById('nextInfo').innerText="Prochaine série : "+nextReps+" reps";

  current++;

  if(current>=series.length){ finish(); return; }

  runPhase(restTime,'Repos','rest',()=>{
    nextSeries();
  }, false, 0);
}

function runPhase(seconds,label,color,callback, isSeries, reps){
  cancelAnimationFrame(rafId);

  phaseDuration = seconds*1000;
  remainingPhaseMs = phaseDuration;
  currentCallback = callback;
  currentColor = color;
  currentLabel = label;
  currentReps = reps;
  isSeriesPhase = isSeries;

  startPhase();
}

function startPhase(){
  phaseStart = performance.now();

  function animate(now){
    if(paused) return;

    let elapsed = now - phaseStart;
    let remaining = Math.max(0, remainingPhaseMs - elapsed);

    let progress = remaining / phaseDuration;
    let percent = progress*100;

    let circle=document.getElementById('circle');
    let labelDiv=document.getElementById('label');
    let timerValue=document.getElementById('timerValue');
    let palette = PHASE_COLORS[currentColor] || PHASE_COLORS.blue;

    circle.style.background=`conic-gradient(${palette.fill} ${percent}%, ${palette.track} ${percent}%)`;
    circle.className = 'timer-ring ' + palette.cls;
    timerValue.innerText=Math.ceil(remaining/1000);
    labelDiv.innerText=currentLabel;
    labelDiv.className = 'phase-badge ' + palette.cls.replace('phase-', '');

    if(remaining>0){
      rafId=requestAnimationFrame(animate);
    } else {
      currentCallback();
    }
  }

  rafId=requestAnimationFrame(animate);
}

function togglePause(){
  paused=!paused;
  let btn=document.getElementById('pauseBtn');

  if(paused){
    btn.innerText="Reprendre";
    cancelAnimationFrame(rafId);

    let now=performance.now();
    let elapsed=now-phaseStart;
    remainingPhaseMs=Math.max(0, remainingPhaseMs - elapsed);
  } else {
    btn.innerText="Pause";
    startPhase();
  }
}

function skip(){
  cancelAnimationFrame(rafId);

  if(isSeriesPhase){
    done += currentReps;
  }

  currentCallback();
}

function finish(){
  cancelAnimationFrame(rafId);
  clearInterval(globalTimer);
  document.body.innerHTML=`
    <div class="finish-screen">
      <div class="finish-card">
        <span class="finish-icon">🏆</span>
        <h1>Séance terminée !</h1>
        <p>Félicitations — vous avez accompli ${done} répétitions.</p>
      </div>
    </div>`;
}
</script>
